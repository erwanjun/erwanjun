<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <!-- warm cream background -->
  <rect width="500" height="300" fill="#FFF8DC"/>

  <!-- head + ears silhouette -->
  <path d="M 200 105 L 180 45 L 235 100 Q 250 96 265 100 L 320 45 L 300 105 C 345 120 345 220 250 240 C 155 220 155 120 200 105 Z"
        fill="#FFF8DC" stroke="#3D2817" stroke-width="3" stroke-linejoin="round"/>

  <!-- inner ears (pink) -->
  <path d="M 205 95 L 195 60 L 225 92 Z" fill="#FFB6C1"/>
  <path d="M 275 92 L 305 60 L 295 95 Z" fill="#FFB6C1"/>

  <!-- closed happy eyes -->
  <path d="M 215 165 Q 225 150 235 165" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>
  <path d="M 265 165 Q 275 150 285 165" fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="200" cy="190" rx="12" ry="6" fill="#FFB6C1"/>
  <ellipse cx="300" cy="190" rx="12" ry="6" fill="#FFB6C1"/>

  <!-- nose -->
  <path d="M 243 185 L 257 185 L 250 195 Z" fill="#FF8FA3" stroke="#3D2817" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- mouth (a cute W) -->
  <path d="M 250 195 L 250 205 M 250 205 Q 240 215 232 207 M 250 205 Q 260 215 268 207"
        fill="none" stroke="#3D2817" stroke-width="3" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#3D2817" stroke-width="2" stroke-linecap="round">
    <line x1="170" y1="180" x2="135" y2="173"/>
    <line x1="170" y1="190" x2="130" y2="193"/>
    <line x1="170" y1="200" x2="138" y2="213"/>
    <line x1="330" y1="180" x2="365" y2="173"/>
    <line x1="330" y1="190" x2="370" y2="193"/>
    <line x1="330" y1="200" x2="362" y2="213"/>
  </g>

  <!-- hearts -->
  <path d="M 415 85 C 415 75, 400 75, 400 88 C 400 75, 385 75, 385 88 C 385 100, 400 115, 400 115 C 400 115, 415 100, 415 88 Z" fill="#FF8FA3"/>
  <path d="M 95 225 C 95 218, 85 218, 85 228 C 85 218, 75 218, 75 228 C 75 237, 85 247, 85 247 C 85 247, 95 237, 95 228 Z" fill="#FFB6C1"/>

  <!-- sparkles -->
  <g fill="#E8A87C">
    <circle cx="115" cy="90" r="3"/>
    <circle cx="390" cy="215" r="3"/>
    <circle cx="65" cy="155" r="2"/>
    <circle cx="435" cy="155" r="2"/>
    <circle cx="350" cy="95" r="2"/>
    <circle cx="150" cy="250" r="2"/>
  </g>
</svg>
